name: Gentoo live source build (shared)

on:
  workflow_call:
    inputs:
      target:
        description: "86box, ship-of-harkinian, or rnote"
        type: string
        required: true

permissions:
  contents: read

jobs:
  gentoo-build:
    name: Compile ${{ inputs.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Check out goonbox-overlay
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Compile selected ebuild(s) in Gentoo
        env:
          LIVE_TARGET: ${{ inputs.target }}
        run: |
          set -euxo pipefail
          docker pull gentoo/portage:latest
          docker pull gentoo/stage3:latest

          snapshot_mount=goonbox-overlay-build-snapshot
          if [[ $LIVE_TARGET == rnote ]]; then
            printf 'Overlay commit: %s\n' "$(git rev-parse HEAD)"
            docker image inspect --format '{{.RepoTags}} {{.RepoDigests}}' \
              gentoo/stage3:latest gentoo/portage:latest
            snapshot_mount+=:ro
          fi

          docker create --name goonbox-overlay-build-snapshot \
            gentoo/portage:latest /bin/true
          trap 'docker rm -f goonbox-overlay-build-snapshot >/dev/null 2>&1 || true' EXIT

          docker run --rm \
            --volumes-from "$snapshot_mount" \
            -v "$GITHUB_WORKSPACE:/work/goonbox-overlay:ro" \
            -e LIVE_TARGET \
            gentoo/stage3:latest \
            /bin/bash -euxo pipefail -c '
              ln -s /work/goonbox-overlay /var/db/repos/goonbox-overlay

              rm -rf /etc/portage/repos.conf
              mkdir -p /etc/portage/repos.conf
              cat > /etc/portage/repos.conf/ci.conf <<EOF
          [DEFAULT]
          main-repo = gentoo

          [gentoo]
          location = /var/db/repos/gentoo

          [goonbox-overlay]
          location = /var/db/repos/goonbox-overlay
          masters = gentoo
          EOF

              mkdir -p /etc/portage/package.accept_keywords /etc/portage/package.license /etc/portage/package.use
              cat > /etc/portage/package.accept_keywords/live-overlay <<EOF
          =app-emulation/86Box-9999::goonbox-overlay **
          =app-emulation/86Box-roms-9999::goonbox-overlay **
          media-libs/librashader ~amd64
          media-gfx/rnote ~amd64
          =games-action/ship-of-harkinian-9999::goonbox-overlay **
          EOF
              cat > /etc/portage/package.license/live-overlay <<EOF
          games-action/ship-of-harkinian all-rights-reserved
          app-emulation/86Box-roms all-rights-reserved
          EOF
              cat > /etc/portage/package.use/graphics-ci <<EOF
          media-libs/libglvnd X
          media-libs/libsdl2 opengl video
          dev-qt/qtbase opengl vulkan
          dev-qt/qttools opengl
          x11-libs/libxkbcommon X
          EOF

              # Fresh-stage3 defaults are missing these GTK dependency USE flags.
              if [[ ${LIVE_TARGET} == rnote ]]; then
                cat >> /etc/portage/package.use/graphics-ci <<EOF
          media-libs/freetype harfbuzz
          x11-libs/cairo X
          EOF
              fi

              # A fresh stage3 compiles dependencies too; keep RAM use bounded.
              export MAKEOPTS="-j2"
              case "${LIVE_TARGET}" in
                86box)
                  emerge --noreplace --with-bdeps=y --verbose =app-emulation/86Box-9999
                  ;;
                ship-of-harkinian)
                  atom="=games-action/ship-of-harkinian-9999::goonbox-overlay"
                  build_log=$(mktemp)
                  emerge --color=n --noreplace --with-bdeps=y --verbose "$atom" | tee "$build_log"
                  python3 /work/goonbox-overlay/.github/scripts/check-ship-revision.py \
                    "$build_log" /var/db/pkg/games-action/ship-of-harkinian-9999
                  ;;
                rnote)
                  # Only Rnote may use binary dependencies. Keep Portage
                  # signature, USE, and dependency checks enabled.
                  test "$(uname -m)" = x86_64
                  rm -rf /etc/portage/binrepos.conf
                  mkdir -p /etc/portage/binrepos.conf
                  cat > /etc/portage/binrepos.conf/gentoo-ci.conf <<EOF
          [gentoo-official]
          sync-uri = https://distfiles.gentoo.org/releases/amd64/binpackages/23.0/x86-64/
          EOF
                  cat >> /etc/portage/make.conf <<"EOF"

          FEATURES="${FEATURES} binpkg-request-signature"
          EOF
                  getuto
                  atom=media-gfx/rnote::goonbox-overlay
                  opts=(--color=n --verbose --with-bdeps=y --getbinpkg
                    --binpkg-respect-use=y --binpkg-changed-deps=y --usepkg-exclude=media-gfx/rnote)
                  plan=$(mktemp)
                  emerge "${opts[@]}" --pretend --tree "$atom" | tee "$plan"
                  mapfile -t source_targets < <(
                    sed -nE "s/^\[ebuild[^]]*\][[:space:]]+(media-gfx\/rnote-[0-9][[:alnum:]_.-]*)::goonbox-overlay([[:space:]].*|$)/\1/p" "$plan"
                  )
                  if (( ${#source_targets[@]} != 1 )); then
                    echo "Expected exactly one Rnote source ebuild from goonbox-overlay" >&2
                    exit 2
                  fi
                  printf "Rnote source target: %s::goonbox-overlay\nBinary dependencies selected: %s\n" \
                    "${source_targets[0]}" "$(grep -cE "^\[binary[[:space:]]" "$plan" || true)"
                  emerge "${opts[@]}" --oneshot "$atom"
                  vdb="/var/db/pkg/${source_targets[0]}"
                  test -s "$vdb/CONTENTS"
                  test "$(cat "$vdb/repository")" = goonbox-overlay
                  test -x /usr/bin/rnote
                  test -x /usr/bin/rnote-cli
                  /usr/bin/rnote-cli --version
                  ;;
                both)
                  emerge --noreplace --with-bdeps=y --verbose \
                    =app-emulation/86Box-9999 =games-action/ship-of-harkinian-9999
                  ;;
                *) echo "Unknown target: ${LIVE_TARGET}" >&2; exit 2 ;;
              esac
            '
