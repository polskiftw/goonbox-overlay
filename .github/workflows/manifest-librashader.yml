name: Generate librashader distfile Manifest (temporary)

on:
  push:
    branches:
      - feature/librashader-0.12.1
    paths:
      - "media-libs/librashader/**"
      - ".github/workflows/manifest-librashader.yml"

permissions:
  contents: write

concurrency:
  group: librashader-manifest-branch
  cancel-in-progress: true

jobs:
  manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out overlay
        uses: actions/checkout@v5

      - name: Generate checksums from original pinned distfiles using Gentoo Portage
        run: |
          set -euxo pipefail
          docker pull gentoo/portage:latest
          docker pull gentoo/stage3:latest
          docker create --name manifest-gentoo-repo gentoo/portage:latest /bin/true
          trap 'docker rm -f manifest-gentoo-repo >/dev/null 2>&1 || true' EXIT
          docker run --rm --volumes-from manifest-gentoo-repo \
            -v "$GITHUB_WORKSPACE:/work/goonbox-overlay:rw" \
            gentoo/stage3:latest /bin/bash -euxo pipefail -c '
              ln -s /work/goonbox-overlay /var/db/repos/goonbox-overlay
              mkdir -p /etc/portage/repos.conf
              cat > /etc/portage/repos.conf/ci.conf <<EOF
          [DEFAULT]
          main-repo = gentoo

          [gentoo]
          location = /var/db/repos/gentoo

          [goonbox-overlay]
          location = /var/db/repos/goonbox-overlay
          masters = gentoo
          EOF
              ebuild /var/db/repos/goonbox-overlay/media-libs/librashader/librashader-0.12.1.ebuild manifest
            '

      - name: Commit verified Manifest back to this test branch
        run: |
          set -euxo pipefail
          test -s media-libs/librashader/Manifest
          grep -q 'librashader-0.12.1.tar.gz' media-libs/librashader/Manifest
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add media-libs/librashader/Manifest
          if ! git diff --cached --quiet; then
            git commit -m "media-libs/librashader: record 0.12.1 and Cargo distfile hashes"
            git push origin HEAD:feature/librashader-0.12.1
          fi
