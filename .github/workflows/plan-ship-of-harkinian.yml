name: Ship of Harkinian - Portage dependency plan

on:
  workflow_dispatch:
  push:
    paths:
      - "games-action/ship-of-harkinian/**"
  pull_request:
    paths:
      - "games-action/ship-of-harkinian/**"

permissions:
  contents: read

concurrency:
  group: plan-ship-of-harkinian-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    uses: ./.github/workflows/portage-plan-common.yml
    with:
      package: games-action/ship-of-harkinian
