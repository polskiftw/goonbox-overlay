name: Gentoo dependency plan (shared)

on:
  workflow_call:
    inputs:
      package:
        description: "Category/package for Gentoo live ebuild"
        type: string
        required: true

permissions:
  contents: read

jobs:
  dependency-plan:
    name: Plan ${{ inputs.package }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out goonbox-overlay
        uses: actions/checkout@v5

      - name: Validate Ship live no-network patch
        if: inputs.package == 'games-action/ship-of-harkinian'
        run: |
          set -euxo pipefail
          workdir="$(mktemp -d)"
          mkdir -p "$workdir/soh"
          curl -fsSL \
            "https://raw.githubusercontent.com/HarbourMasters/Shipwright/develop/soh/CMakeLists.txt" \
            -o "$workdir/soh/CMakeLists.txt"
          patch --dry-run -d "$workdir" -p1 < \
            games-action/ship-of-harkinian/files/ship-of-harkinian-live-no-network.patch

      - name: Resolve live package with Portage in Gentoo
        env:
          TARGET_PACKAGE: ${{ inputs.package }}
        run: |
          docker pull gentoo/portage:latest
          docker pull gentoo/stage3:latest

          docker create \
            --name goonbox-overlay-portage-snapshot \
            gentoo/portage:latest /bin/true

          docker run --rm \
            --volumes-from goonbox-overlay-portage-snapshot \
            -v "$GITHUB_WORKSPACE:/work/goonbox-overlay:ro" \
            -e TARGET_PACKAGE \
            gentoo/stage3:latest \
            /bin/bash -euxo pipefail -c '
              ln -s /work/goonbox-overlay /var/db/repos/goonbox-overlay

              rm -rf /etc/portage/repos.conf
              mkdir -p /etc/portage/repos.conf
              cat > /etc/portage/repos.conf/ci.conf <<EOF
          [DEFAULT]
          main-repo = gentoo

          [gentoo]
          location = /var/db/repos/gentoo

          [goonbox-overlay]
          location = /var/db/repos/goonbox-overlay
          masters = gentoo
          EOF

              mkdir -p /etc/portage/package.accept_keywords
              echo "=${TARGET_PACKAGE}-9999::goonbox-overlay **" \
                > /etc/portage/package.accept_keywords/live-overlay

              # The 86Box default shader runtime is a versioned ~amd64 ebuild.
              if [[ ${TARGET_PACKAGE} == app-emulation/86Box ]]; then
                echo "media-libs/librashader ~amd64" >> /etc/portage/package.accept_keywords/live-overlay
              fi

              if [[ ${TARGET_PACKAGE} == games-action/ship-of-harkinian ]]; then
                mkdir -p /etc/portage/package.license /etc/portage/package.use
                echo "games-action/ship-of-harkinian all-rights-reserved" \
                  > /etc/portage/package.license/ship-of-harkinian
                cat > /etc/portage/package.use/graphics-ci <<EOF
          media-libs/libglvnd X
          media-libs/libsdl2 opengl video
          EOF
              else
                mkdir -p /etc/portage/package.use
                cat > /etc/portage/package.use/graphics-ci <<EOF
          dev-qt/qtbase opengl vulkan
          dev-qt/qttools opengl
          media-libs/libglvnd X
          x11-libs/libxkbcommon X
          EOF
              fi

              emerge --info
              emerge --pretend --verbose --tree --with-bdeps=y \
                "=${TARGET_PACKAGE}-9999"
            '

          docker rm goonbox-overlay-portage-snapshot
