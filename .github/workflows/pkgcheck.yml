name: pkgcheck

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pkgcheck-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pkgcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Check out goonbox-overlay
        uses: actions/checkout@v5
        with:
          path: goonbox-overlay

      - name: Check out Gentoo repository
        uses: actions/checkout@v5
        with:
          repository: gentoo/gentoo
          path: gentoo
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install pkgcheck
        run: python -m pip install --disable-pip-version-check pkgcheck

      - name: Configure Portage repositories and profile
        run: |
          sudo mkdir -p /etc/portage/repos.conf
          {
            echo "[gentoo]"
            echo "location = $GITHUB_WORKSPACE/gentoo"
            echo
            echo "[goonbox-overlay]"
            echo "location = $GITHUB_WORKSPACE/goonbox-overlay"
            echo "masters = gentoo"
          } | sudo tee /etc/portage/repos.conf/ci.conf >/dev/null

          sudo ln -s             "$GITHUB_WORKSPACE/gentoo/profiles/default/linux/amd64/23.0"             /etc/portage/make.profile

      - name: Run pkgcheck
        run: pkgcheck scan --exit error "$GITHUB_WORKSPACE/goonbox-overlay"
