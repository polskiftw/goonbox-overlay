name: pkgcheck

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pkgcheck-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pkgcheck:
    runs-on: ubuntu-26.04
    steps:
      - name: Check out goonbox-overlay
        uses: actions/checkout@v5
        with:
          path: goonbox-overlay

      - name: Check out Gentoo repository
        uses: actions/checkout@v5
        with:
          repository: gentoo/gentoo
          path: gentoo
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install pkgcheck
        run: python -m pip install --disable-pip-version-check pkgcheck

      # py-tree-sitter 0.26.0 has a known SIGSEGV in pkgcheck; use the exact
      # fixed revision shipped in pkgcheck's upstream Dockerfile.
      - name: Install fixed tree-sitter binding
        run: |
          python -m pip install --disable-pip-version-check --force-reinstall --no-deps \
            "tree-sitter @ git+https://github.com/tree-sitter/py-tree-sitter.git@2e556e540dd4ccce0e24c92d4413ef9ac85284a5"

      - name: Configure Portage repositories and profile
        run: |
          sudo mkdir -p /etc/portage/repos.conf
          {
            echo "[gentoo]"
            echo "location = $GITHUB_WORKSPACE/gentoo"
            echo
            echo "[goonbox-overlay]"
            echo "location = $GITHUB_WORKSPACE/goonbox-overlay"
            echo "masters = gentoo"
          } | sudo tee /etc/portage/repos.conf/ci.conf >/dev/null

          sudo ln -s             "$GITHUB_WORKSPACE/gentoo/profiles/default/linux/amd64/23.0"             /etc/portage/make.profile

      - name: Run pkgcheck
        run: pkgcheck scan --jobs 2 --exit error,-NonsolvableDepsInDev "$GITHUB_WORKSPACE/goonbox-overlay"
